# OnTheBus parent iOS — Codemagic (Windows cannot produce an IPA).
#
# Codemagic UI (once):
# 1. Add this GitHub repo as a Flutter app; enable this yaml.
# 2. Team integrations → Apple Developer Portal (for automatic signing).
# 3. Team integrations → App Store Connect API key named "onthebus"
#    (Issuer ID + Key ID + .p8 from App Store Connect → Users and Access → Integrations).
# 4. Environment variable group or workflow secret: MAPS_API_KEY
#    (Maps SDK for iOS, restricted to bundle id com.schooltrack.parentApp).
# 5. After the first App Store Connect app exists, set APP_STORE_APPLE_ID
#    (numeric Apple ID from App Information) if you want auto-incremented TestFlight numbers.
#
# Trigger from the Codemagic UI. Do not submit to App Store review from CI —
# upload TestFlight only; submit in App Store Connect after a device smoke test.

workflows:
  parent-ios-testflight:
    name: OnTheBus iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/parent_app
    integrations:
      app_store_connect: onthebus
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schooltrack.parentApp
      vars:
        BUNDLE_ID: com.schooltrack.parentApp
    scripts:
      - name: Write Google Maps iOS key
        script: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "MAPS_API_KEY is not set in Codemagic environment variables."
            exit 1
          fi
          echo "MAPS_API_KEY=${MAPS_API_KEY}" > ios/Flutter/Secrets.xcconfig
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build signed IPA
        script: |
          set -euo pipefail
          BUILD_ARGS=(--release --export-options-plist=/Users/builder/export_options.plist)
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform IOS || true)"
            if [ -n "${LATEST}" ] && [ "${LATEST}" != "None" ]; then
              BUILD_ARGS+=(--build-number="$((LATEST + 1))")
            fi
          fi
          flutter build ipa "${BUILD_ARGS[@]}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
