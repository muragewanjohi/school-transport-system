# OnTheBus parent iOS — Codemagic (Windows cannot produce an IPA).
#
# Codemagic UI (once):
# 1. Add this GitHub repo as a Flutter app; enable this yaml.
# 2. Team integrations → Apple Developer Portal (for automatic signing).
# 3. Team integrations → App Store Connect API key named
#    "STOREFLOW MICROSYSTEMS LIMITED"
#    (Issuer ID + Key ID + .p8 from App Store Connect → Users and Access → Integrations).
# 4. Environment variable group or workflow secret: MAPS_API_KEY
#    (Maps SDK for iOS, restricted to bundle id com.schooltrack.parentApp).
# 5. APP_STORE_APPLE_ID is optional. The workflow looks up the numeric Apple ID
#    from bundle com.schooltrack.parentApp and increments TestFlight's last
#    cfBundleVersion so uploads do not reuse a build number.
#
# Trigger from the Codemagic UI. Do not submit to App Store review from CI —
# upload TestFlight only; submit in App Store Connect after a device smoke test.

workflows:
  parent-ios-testflight:
    name: OnTheBus iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/parent_app
    integrations:
      app_store_connect: STOREFLOW MICROSYSTEMS LIMITED
    environment:
      groups:
        - Maps
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schooltrack.parentApp
      vars:
        BUNDLE_ID: com.schooltrack.parentApp
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
      - name: Inject Google Maps iOS key
        script: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "MAPS_API_KEY is not set in Codemagic environment variables."
            exit 1
          fi
          # pod install can rewrite Flutter/*.xcconfig and drop Secrets. Write the
          # key after pods, restore the include, and stamp Info.plist so tiles load.
          echo "MAPS_API_KEY=${MAPS_API_KEY}" > ios/Flutter/Secrets.xcconfig
          for f in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            grep -q 'Secrets.xcconfig' "$f" || echo '#include? "Secrets.xcconfig"' >> "$f"
          done
          /usr/libexec/PlistBuddy -c "Set :GoogleMapsApiKey ${MAPS_API_KEY}" ios/Runner/Info.plist
      - name: Set up code signing settings on Xcode project
        script: |
          set -euo pipefail
          # Writes $HOME/export_options.plist used by flutter build ipa
          xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA
        script: |
          set -euo pipefail
          EXPORT_PLIST="${HOME}/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            echo "Missing $EXPORT_PLIST — xcode-project use-profiles did not run successfully."
            exit 1
          fi
          BUILD_ARGS=(--release --export-options-plist="$EXPORT_PLIST")
          APPLE_ID="${APP_STORE_APPLE_ID:-}"
          if [ -z "$APPLE_ID" ]; then
            APPLE_ID="$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | python3 -c '
import json, sys
payload = json.load(sys.stdin)
if isinstance(payload, dict):
    rows = payload.get("data") or payload.get("apps") or []
elif isinstance(payload, list):
    rows = payload
else:
    rows = []
if not rows:
    raise SystemExit(1)
row = rows[0]
print(row["id"] if isinstance(row, dict) else row)
' || true)"
          fi
          if [ -n "$APPLE_ID" ]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number --platform IOS --all-versions "$APPLE_ID" || true)"
            if [[ "${LATEST}" =~ ^[0-9]+$ ]]; then
              BUILD_ARGS+=(--build-number="$((LATEST + 1))")
            fi
          fi
          flutter build ipa "${BUILD_ARGS[@]}"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
